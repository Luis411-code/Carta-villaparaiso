<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Villa Paraíso Guardalavaca · Carta</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=cinzel:400,600,700|cormorant-garamond:400,500,600|poppins:300,400,500,600" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="top-ornament"></div>

  <header class="hero">
    <div class="hero-content">
      <div class="logo-wrapper">
        <img src="img/logo.png" alt="Logo Villa Paraíso Guardalavaca" class="logo" id="heroLogo" />
      </div>
      <div class="hero-divider">
        <span class="divider-line"></span>
        <span class="divider-icon">✦</span>
        <span class="divider-line"></span>
      </div>
      <h1 id="heroNombre">Villa Paraíso</h1>
      <p class="subtitle" id="heroSubtitulo">Guardalavaca</p>
      <p class="tagline" id="heroTagline">Cocina del mar &amp; parrilla</p>
      <div class="info-badges">
        <span id="heroHoras">🕐 12:00 - 23:00</span>
      </div>
    </div>
  </header>

  <!-- Filtros Rápidos (Punto 3) -->
  <div class="filters-bar" id="filtersBar">
    <button class="filter-btn" data-filter="vegetariano">🌱 Vegetariano</button>
    <button class="filter-btn" data-filter="sin-gluten">🌾 Sin Gluten</button>
    <button class="filter-btn" data-filter="picante">🌶️ Picante</button>
  </div>

  <nav class="categories" id="categories"></nav>
  
  <!-- Contenedor de Recomendados (Punto 1) -->
  <section id="destacados" class="category-section" style="display: none;">
    <h2 class="category-title"><span>🌟</span> RECOMENDADOS</h2>
    <div id="destacadosContainer" class="items-grid"></div>
  </section>

  <main id="menu" class="menu-container"></main>

  <footer class="footer">
    <div class="footer-ornament">✦ ✦ ✦</div>
    <p class="footer-message" id="footerMensaje">Gracias por preferirnos</p>
    <p class="small" id="footerSub">Será un placer atenderle</p>
    <p class="small" id="footerCopy">© 2026 Villa Paraíso Guardalavaca</p>
  </footer>

  <!-- 📋 BOTÓN FLOTANTE DE LA COMANDA -->
  <button id="cartBtn" class="cart-btn hidden" aria-label="Ver Orden">
    <span class="cart-icon">📋</span>
    <span id="cartCount" class="cart-count">0</span>
  </button>

  <!-- 📋 PANEL DE LA COMANDA -->
  <div id="cartOverlay" class="cart-overlay hidden">
    <div id="cartPanel" class="cart-panel">
      <div class="cart-header">
        <h2>📋 Tu Orden</h2>
        <button id="cartClose" class="cart-close" aria-label="Cerrar">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      
      <div class="cart-footer">
        <div class="cart-field">
          <label for="cartNotas" style="color: var(--primary); font-weight: bold;">⚠️ Notas y Alergias</label>
          <textarea id="cartNotas" placeholder="Ej: Alérgico al marisco, sin cebolla..." rows="2" style="border-color: var(--primary-light);"></textarea>
        </div>
        <div class="cart-total">
          <span>Total:</span>
          <strong id="cartTotal">$0.00</strong>
        </div>
        <button id="cartEnviar" class="cart-enviar">✅ Enviar</button>
      </div>
    </div>
  </div>

  <!-- ✅ TOAST DE CONFIRMACIÓN -->
  <div id="toast" class="toast hidden">
    <span class="toast-icon">✅</span>
    <div class="toast-content">
      <strong id="toastTitle">Pedido enviado</strong>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
